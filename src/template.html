<title>Мои города</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: golden-hour map on the left (top on phones); right ledger switches between the city list, "my trips" track and a city card. Single light look. */
:root{
  --bg:#f7f6fa; --card:#ffffff; --line:#e6e2ec;
  --ink:#1f1b2e; --mute:#6b6680; --faint:#aaa4ba;
  --been:#e2557c; --been-deep:#c23a62; --want:#6b4bd8; --want-deep:#5236c0; --soft:#fff1f3; --soft-w:#f2eefe;
  --sun:linear-gradient(160deg,#ffc58f 0%,#ff8fa3 50%,#9a86ff 100%);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;overflow:hidden}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--want);outline-offset:2px;border-radius:6px}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 460px}
.stage{position:relative;min-width:0;min-height:0;background:var(--sun)}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map.hover{cursor:pointer}
.hud{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:max(20px,env(safe-area-inset-left,0px));pointer-events:none;display:flex;align-items:flex-end;gap:10px;color:#fff}
.hud b{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,5vw,64px);line-height:.85;text-shadow:0 2px 14px rgba(120,40,90,.25);font-variant-numeric:tabular-nums}
.hud span{font-size:13px;line-height:1.25;padding-bottom:3px}
.hud em{font-style:normal;font-weight:600}
.mapctl{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px}
.mapctl button{background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px rgba(31,27,46,.08);border-radius:10px;width:38px;height:38px;font-size:18px}
.legend{position:absolute;left:max(20px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;background:rgba(255,255,255,.9);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;box-shadow:0 4px 16px rgba(120,40,90,.15)}
.legend span{display:flex;align-items:center;gap:6px}
.shareFab{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#fff;color:var(--ink);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;box-shadow:0 6px 20px rgba(120,40,90,.22);display:flex;gap:8px;align-items:center}
.pw{width:15px;height:15px;flex:none;vertical-align:-3px}

.panel{background:var(--bg);min-width:0;min-height:0;overflow-y:auto;border-left:1px solid var(--line);padding-block:calc(20px + env(safe-area-inset-top,0px)) 40px;padding-left:22px;padding-right:max(22px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.brandrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1}
.brand em{font-style:normal;background:var(--sun);-webkit-background-clip:text;background-clip:text;color:transparent}
.sharebtn{font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;display:flex;gap:6px;align-items:center}
.stats{display:flex;gap:10px}
.stat{flex:1;min-width:0;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
.stat:hover{border-color:#d6cff0;box-shadow:0 4px 14px rgba(31,27,46,.08);transform:translateY(-1px)}
.stat[aria-pressed="true"]{border-color:var(--been);box-shadow:0 0 0 1px var(--been)}
.stat.want[aria-pressed="true"]{border-color:var(--want);box-shadow:0 0 0 1px var(--want)}
.stat .go{float:right;color:var(--faint);font-size:14px;line-height:1}
.stat b{display:block;font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mute)}
.stat.been b{color:var(--been-deep)}
.stat.want b{color:var(--want-deep)}
.tabs{display:flex;background:#ece9f2;border-radius:12px;padding:3px;gap:3px}
.tab{flex:1;padding:8px 6px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--mute);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(31,27,46,.08)}
.tab .cnt{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--want);color:#fff;font-size:12px;line-height:20px}
.ringban{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;width:100%;padding:12px 14px;border-radius:14px;background:linear-gradient(120deg,#fff6df,#ffe6b0);border:1px solid #f3d38a}
.ringban[aria-pressed="true"]{box-shadow:0 0 0 2px #f5b83d}
.ringban .rt{display:grid;gap:2px;min-width:0}
.ringban b{font-family:var(--f-display);font-weight:600;font-size:15px;color:#7a4e04}
.ringban small{font-size:12.5px;color:#8a6a2a}
.ringban .rd{display:flex;gap:4px;flex:none}
.ringban .rd i{width:10px;height:10px;border-radius:50%;border:1.5px solid #e2a93a;background:#fff}
.ringban .rd i.on{background:#f5a623;border-color:#f5a623}
.ringban .rd i.w{border-style:dashed;border-color:var(--want)}
.gr{display:inline-block;margin-left:8px;padding:2px 7px;border-radius:999px;background:#fff1cc;color:#8a5a00;font-family:var(--f-body);font-size:10.5px;font-weight:600;vertical-align:middle;letter-spacing:0}
.ringrow{display:flex;gap:10px;align-items:center}
.ringrow .line{flex:1}
.ringrow .gr{display:none}
.ri{width:24px;height:24px;border-radius:50%;background:#fff1cc;color:#8a5a00;font-weight:700;font-size:12px;display:grid;place-items:center;flex:none}
.regs{display:grid;gap:4px}
.reg{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:14px;color:var(--mute)}
.reg.on{color:var(--ink);font-weight:600;border-color:#f3c6d3}
.reg em{font-style:normal;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--been-deep);flex:none}
.reg i{position:absolute;left:0;bottom:0;height:3px;background:var(--been);border-radius:0 3px 3px 0}
.reg:hover{border-color:#d6cff0}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.search::placeholder{color:var(--faint)}

.hubrow{border-bottom:1px solid var(--line);padding:10px 0}
.line{display:flex;align-items:center;gap:8px}
.nm{flex:1;min-width:0;text-align:left;overflow-wrap:break-word;color:#3d3850}
.nm:hover{color:var(--ink);text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}
.hubrow > .line .nm{font-family:var(--f-display);font-weight:600;line-height:1.1}
.line.b .nm{color:var(--been-deep)}
.line.w .nm{color:var(--want-deep)}
.pill{flex:none;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;color:var(--mute);display:flex;align-items:center;gap:4px}
.pill .pw{width:13px;height:13px}
.pill:hover{border-color:var(--faint);color:var(--ink)}
.pill[data-k="b"][aria-pressed="true"]{background:var(--been);border-color:var(--been);color:#fff}
.pill[data-k="w"][aria-pressed="true"]{border-color:var(--want);color:var(--want-deep);background:var(--soft-w)}
.more{margin-top:6px;font-size:13px;color:var(--mute)}
.more:hover{color:var(--ink)}
.more b{font-weight:600;color:var(--been-deep)}
.subs{margin:8px 0 2px 14px;border-left:1px solid var(--line);padding-left:12px}
.subs .line{padding:4px 0}
.subs .s1 .nm{font-size:17px;font-weight:600}
.subs .s2 .nm{font-size:14.5px}
.subs .s3 .nm{font-size:13px}
.subs .pill{padding:3px 9px;font-size:11px}
.empty{color:var(--mute);padding:14px 0;text-wrap:pretty}

.trip{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;margin-top:10px;text-align:left;width:100%}
.trip:hover{border-color:#d6cff0}
.trip .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.trip .hd strong{font-family:var(--f-display);font-weight:600;font-size:19px;color:var(--want-deep)}
.trip .hd span{font-size:13px;color:var(--mute);text-align:right}
.trip .price{font-size:14px}
.trip .price b{font-variant-numeric:tabular-nums}
.dots{display:flex;gap:5px;align-items:center}
.dots i{flex:1;height:6px;border-radius:6px;background:#ece9f2}
.dots i.on{background:var(--want)}
.dots small{margin-left:6px;font-size:12px;color:var(--mute);white-space:nowrap}

.card .back{font-size:13px;color:var(--mute);font-weight:600;margin-bottom:14px}
.card .back:hover{color:var(--ink)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
.cname{font-family:var(--f-display);font-weight:800;line-height:1;letter-spacing:-.01em;margin:6px 0 6px;font-size:clamp(30px,7vw,46px);overflow-wrap:break-word;text-wrap:balance}
.cname.b{color:var(--been-deep)} .cname.w{color:var(--want-deep)}
.cmeta{color:var(--mute);font-size:14px}
.bigmarks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 6px}
.bigmark{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;font-weight:600;display:flex;gap:10px;align-items:center;justify-content:center}
.bigmark .pw{width:18px;height:18px}
.bigmark[data-k="b"][aria-pressed="true"]{background:var(--been);border-color:var(--been);color:#fff}
.bigmark[data-k="w"][aria-pressed="true"]{background:var(--soft-w);border-color:var(--want);color:var(--want-deep)}
.sec{margin-top:22px}
.sec h3{margin:0 0 10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
.sec h3 small{letter-spacing:0;text-transform:none;font-weight:500;color:var(--faint);font-size:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.steps{display:grid;gap:2px}
.step{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #f0edf5}
.step:last-child{border-bottom:0}
.step .ck{width:24px;height:24px;border-radius:50%;border:2px solid #d9d3e8;display:grid;place-items:center;flex:none;color:#fff;font-size:13px;font-weight:700}
.step.done .ck{background:var(--want);border-color:var(--want)}
.step .tx{flex:1;min-width:0}
.step .tx b{display:block;font-weight:600}
.step .tx span{font-size:13px;color:var(--mute)}
.step a,.step .act{font-size:13px;font-weight:600;color:var(--want-deep);text-decoration:none;white-space:nowrap}
.step input[type=date]{border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:13px;background:#fff}
.calc .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.fld{display:grid;gap:4px;font-size:12px;color:var(--mute)}
.fld select,.fld .stepper{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:14px;color:var(--ink);width:100%}
.stepper{display:flex;align-items:center;justify-content:space-between;padding:4px 6px!important}
.stepper button{width:30px;height:30px;border-radius:8px;background:#f2eff7;font-size:18px;line-height:1}
.stepper b{font-variant-numeric:tabular-nums}
.seg{display:flex;background:#f2eff7;border-radius:10px;padding:3px}
.seg button{flex:1;padding:6px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(31,27,46,.1)}
.total{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:14px 0 10px;flex-wrap:wrap}
.total b{font-family:var(--f-display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.total span{font-size:13px;color:var(--mute)}
.brk{display:grid;gap:8px}
.br{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px}
.br em{font-style:normal;font-variant-numeric:tabular-nums;font-weight:600}
.br small{grid-column:1/-1;font-size:12px;color:var(--faint)}
.br .bar{grid-column:1/-1;height:6px;border-radius:6px;background:#f2eff7;overflow:hidden}
.br .bar i{display:block;height:100%;border-radius:6px;background:var(--sun)}
.note{font-size:12px;color:var(--faint);margin-top:12px;text-wrap:pretty}
.list3{display:grid;gap:10px}
.it{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.it .n{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--soft);color:var(--been-deep)}
.it b{display:block;font-weight:600}
.it span{font-size:13px;color:var(--mute)}
.souv{background:var(--sun);color:#fff;border-radius:16px;padding:16px}
.souv b{display:block;font-family:var(--f-display);font-weight:600;font-size:18px;margin-bottom:4px}
.souv span{font-size:14px;opacity:.95}
.cta{display:block;text-align:center;margin-top:22px;padding:14px;border-radius:14px;background:var(--ink);color:#fff;text-decoration:none;font-weight:600}
.cta small{display:block;font-weight:400;opacity:.7;font-size:12px;margin-top:2px}

.modal{position:fixed;inset:0;background:rgba(31,27,46,.55);display:grid;place-items:center;z-index:20;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:#fff;border-radius:20px;padding:16px;display:grid;gap:12px;max-width:420px;width:100%;max-height:100%;overflow:auto;justify-items:center}
.sheet img{max-height:62vh;max-width:100%;border-radius:14px;box-shadow:0 10px 30px rgba(31,27,46,.2)}
.sheet .acts{display:flex;gap:8px;width:100%}
.sheet .acts button{flex:1;padding:12px;border-radius:12px;font-weight:600}
.primary{background:var(--ink);color:#fff}
.ghost{background:#f2eff7}
.sheet p{margin:0;font-size:13px;color:var(--mute);text-align:center}


.tab.gen{color:var(--want-deep)}
.pick .lead{margin:4px 0 6px;color:var(--mute);font-size:14px;text-wrap:pretty}
.grp{margin-top:12px}
.grp .gt{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:#4d4862}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.pick textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);resize:vertical;font-size:14px}
.pick .row .fld{max-width:220px}
.slider .sl{display:flex;align-items:center;gap:12px}
.slider input{flex:1;accent-color:var(--want)}
.slider b{min-width:72px;font-variant-numeric:tabular-nums}
.slider small{color:var(--faint);font-size:12px}
.gobtn{width:100%;margin-top:14px;padding:13px;border-radius:14px;background:var(--sun);color:#fff;font-weight:700;font-size:15px;box-shadow:0 8px 20px rgba(255,120,150,.3)}
.genlbl{margin-top:18px;font-size:12px;font-weight:600;color:var(--want-deep)}
.deck{position:relative;height:440px;margin-top:10px}
.gcard{position:absolute;inset:0;background:var(--card);border-radius:22px;box-shadow:0 12px 30px rgba(31,27,46,.14);overflow:hidden;display:flex;flex-direction:column;touch-action:pan-y;user-select:none;-webkit-user-select:none;transform:translateY(calc(var(--d) * 12px)) scale(calc(1 - var(--d) * .04));transition:transform .3s ease,opacity .3s ease;cursor:grab}
.gcard[data-depth="1"],.gcard[data-depth="2"]{pointer-events:none}
.gcard[data-depth="2"]{opacity:.6}
.gcard[data-depth="1"] .body,.gcard[data-depth="2"] .body{visibility:hidden}
.gcard.drag{transition:none;cursor:grabbing}
.gcard .hero{position:relative;padding:18px 18px 16px;color:#fff;flex:none}
.gcard .rg{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.9;font-weight:600}
.gcard h4{margin:6px 0 4px;font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.02;overflow-wrap:break-word}
.gcard .hl{font-size:15px;font-weight:500;opacity:.95}
.stamp{position:absolute;top:16px;padding:4px 10px;border:3px solid #fff;border-radius:10px;font-weight:800;font-size:14px;color:#fff;opacity:0;pointer-events:none}
.stamp.like{left:16px;transform:rotate(-10deg)}
.stamp.nope{right:16px;transform:rotate(10deg)}
.gcard .body{padding:14px 16px 16px;display:grid;gap:10px;overflow:auto;flex:1;align-content:start}
.gcard .why{margin:0;font-size:14.5px}
.gcard .tg{display:flex;gap:6px;flex-wrap:wrap}
.gcard .tg span{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--soft-w);color:var(--want-deep)}
.blk{border-radius:12px;background:#f7f5fa;padding:9px 12px}
.blk .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:600;margin-bottom:2px}
.blk .v{font-size:14px}
.blk .warn{margin-left:8px;font-size:12px;font-weight:600;color:var(--been-deep)}
.gcard .open{justify-self:start;margin-top:2px;font-weight:600;color:var(--want-deep)}
.skel .body{gap:12px}
.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,#efecf4,#f8f6fb,#efecf4);background-size:200% 100%;animation:sh 1.2s infinite}
.sk.short{width:60%}
@keyframes sh{to{background-position:-200% 0}}
.deckbtns{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:16px}
.rb{width:54px;height:54px;border-radius:50%;background:var(--card);box-shadow:0 4px 14px rgba(31,27,46,.12);font-size:20px;font-weight:700}
.rb.nope{color:var(--mute)}
.rb.like{background:var(--want);color:#fff}
.rb.been{width:auto;height:44px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:600}
.hint{text-align:center;font-size:12px;color:var(--faint);margin:8px 0 0}
.done{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:6px;text-align:center}
.done b{font-family:var(--f-display);font-weight:600;font-size:18px}
.done span{color:var(--mute);font-size:14px}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
@media (max-width:820px){
  .app{display:flex;flex-direction:column}
  .stage{flex:0 0 42%}
  .panel{flex:1;border-left:0;border-top:1px solid var(--line);padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .legend{font-size:12px;padding:6px 10px;gap:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <path id="pinShape" d="M0 .9 C -.25 .45 -.7 .1 -.7 -.35 A .7 .7 0 1 1 .7 -.35 C .7 .1 .25 .45 0 .9 Z"/>
  <g id="pinB"><use href="#pinShape" fill="#e2557c"/><circle cx="0" cy="-.35" r=".27" fill="#fff"/></g>
  <g id="pinW"><use href="#pinShape" fill="rgba(107,75,216,.12)" stroke="#6b4bd8" stroke-width=".09" stroke-dasharray=".14 .1"/></g>
